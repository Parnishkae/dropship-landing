<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NOT BROKE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <section class="hero">

    <div class="container">

      <div class="hero-badge">
        LIMITED DROP
      </div>

      <h1 id="product-title"></h1>

      <p class="subtitle" id="product-subtitle"></p>

      <img id="product-image" alt="Product Image" />

      <p class="price" id="product-price"></p>

      <button class="main-btn">
       Оформить заказ
      </button>

    </div>

  </section>

  <section class="benefits">

    <div class="container">

      <div class="benefits-grid" id="benefits-container"></div>

    </div>

  </section>
<section class="image-section">

  <div class="container">

    <img
      src="./images/mocaup.png"
      class="secondary-image"
      alt="Streetwear Style"
    />

  </div>

</section>
  <section class="reviews">

    <div class="container">

      <h2 class="section-title">
        Отзывы
      </h2>

      <div id="reviews-container"></div>

    </div>

  </section>

  <section class="cta">

    <div class="container">

      <h2>
        Осталось ограниченное количество
      </h2>

      <p class="cta-text">
        Успей заказать до следующего дропа
      </p>

      <form id="lead-form">

        <input
          type="text"
          id="name"
          placeholder="Ваше имя"
          required
        />

        <input
          type="text"
          id="phone"
          placeholder="Телефон"
          required
        />

        <button type="submit" class="main-btn">
          Оставить заявку
        </button>

      </form>

    </div>

  </section>

  <script src="config.js"></script>
  <script src="script.js"></script>

</body>

</html>
