<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин — каталог товаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/store.css">
</head>
<body>

<!-- Header -->
<header class="hdr">
  <div class="wrap hdr-in">
    <a href="/" class="logo"><span class="dot"></span><span data-site-name>SHOP</span></a>
    <div class="search">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.2-5.2m0 0A7.5 7.5 0 1 0 5.2 5.2a7.5 7.5 0 0 0 10.6 10.6Z"/></svg>
      <input id="search-input" type="search" placeholder="Поиск товаров…" autocomplete="off">
    </div>
    <div class="hdr-actions">
      <a class="icon-btn" data-tg href="#" target="_blank" rel="noopener">Telegram</a>
      <button class="icon-btn" id="cart-open">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.4a1.13 1.13 0 0 1 1.1.86l.38 1.52m0 0 1.7 6.8a2.25 2.25 0 0 0 2.2 1.7h7.6a2.25 2.25 0 0 0 2.18-1.68l1.34-5.02a1.13 1.13 0 0 0-1.1-1.42H5.13m1.62 12.06a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm11.25 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>
        Корзина <span class="cart-count">0</span>
      </button>
    </div>
  </div>
</header>

<!-- Hero -->
<section class="hero">
  <div class="wrap hero-in">
    <h1 id="hero-title">Каталог товаров</h1>
    <p id="hero-text"></p>
    <div class="hero-cta">
      <a href="#catalog" class="btn btn-primary">Смотреть каталог</a>
      <a class="btn btn-ghost" data-tg href="#" target="_blank" rel="noopener">Написать в Telegram</a>
    </div>
  </div>
</section>

<!-- Toolbar + Grid -->
<main class="wrap" id="catalog">
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div class="sort">
      <select id="sort" aria-label="Сортировка">
        <option value="new">Сначала новые</option>
        <option value="price_asc">Дешевле</option>
        <option value="price_desc">Дороже</option>
        <option value="title">По названию</option>
      </select>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</main>

<footer>
  <div class="wrap foot-in">
    <a href="/" class="logo"><span class="dot"></span><span data-site-name>SHOP</span></a>
    <div class="direct">
      <a class="tag tg" data-tg href="#" target="_blank" rel="noopener">Telegram</a>
      <a class="tag" data-phone href="#">Телефон</a>
    </div>
    <span class="muted">© <span id="year"></span> — все права защищены</span>
  </div>
</footer>

<!-- Cart drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Корзина">
  <div class="drawer-hd"><h3>Корзина</h3><button class="x" id="cart-close">×</button></div>
  <div class="drawer-body" id="cart-body"></div>
  <div class="drawer-ft">
    <div class="total-row"><span>Итого</span><span id="cart-total">0 грн</span></div>
    <form id="checkout-form">
      <div class="field"><label for="c-name">Имя</label><input id="c-name" required placeholder="Как к вам обращаться"></div>
      <div class="field"><label for="c-phone">Телефон / Telegram</label><input id="c-phone" required placeholder="+380…"></div>
      <div class="field"><label for="c-comment">Комментарий</label><textarea id="c-comment" rows="2" placeholder="Размер, цвет, адрес…"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block" id="checkout-btn">Оформить заказ</button>
      <p class="form-note">Нажимая кнопку, вы отправляете заявку менеджеру</p>
    </form>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/store.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
