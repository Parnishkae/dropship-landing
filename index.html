<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Smart Bottle</title>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HERO -->

  <section class="hero">

    <div class="container">

      <h1 id="product-title"></h1>

     <p class="subtitle" id="product-subtitle">
        Умная бутылка для воды с отображением температуры
      </p>

      <img id="product-image"
        src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?q=80&w=1200&auto=format&fit=crop"
        alt="Bottle"
      />

      <button>Заказать сейчас</button>

    </div>

  </section>

  <!-- BENEFITS -->

  <div class="benefits-grid" id="benefits-container"></div>

  <!-- REVIEWS -->

  <div id="reviews-container"></div>

  <!-- CTA -->

<form id="lead-form">

  <input
    type="text"
    id="name"
    placeholder="Ваше имя"
    required
  />

  <input
    type="text"
    id="phone"
    placeholder="Телефон"
    required
  />

  <button type="submit">
    Отправить заявку
  </button>

</form>

  <section class="cta">

    <div class="container">

      <h2>Закажить прямо сейчас
        Осталось всего 10 штук!</h2>

      <button>Оставить заявку</button>

    </div>

  </section>
<script src="config.js"></script>
<script src="script.js"></script>

  <script src="script.js"></script>

</body>
</html>
