name = "dropship-store"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# ── Бинды и секреты настраиваются в дашборде Cloudflare Pages ──
# (Settings → Functions), а НЕ здесь — иначе деплой падает на placeholder-id.
#
# D1 database bindings:   binding "DB"  →  база dropship-db
#   Создать базу:  npx wrangler d1 create dropship-db
#   Применить схему: npx wrangler d1 execute dropship-db --remote --file=./schema.sql
#
# AI bindings:            binding "AI"  →  включает бесплатный Workers AI
#
# Environment variables / secrets:
#   ADMIN_PASSWORD   — пароль для входа в админку (/admin.html)   [обязательно]
#   AUTH_SECRET      — случайная строка 32+ символов для подписи сессии [обязательно]
#   BOT_TOKEN        — токен Telegram-бота
#   CHAT_ID          — id чата/канала, куда падают заявки и отчёты ИИ
#   CRON_SECRET      — секрет для авто-запуска подбора товара по расписанию
#   TG_WEBHOOK_SECRET— секрет для защиты вебхука Telegram-бота (рекомендуется)
#   MARKUP           — наценка авто-подбора, по умолчанию 3 (×3)
#   GEMINI_API_KEY   — (необязательно) бесплатный ключ Google Gemini вместо Workers AI
#   AI_MODEL         — (необязательно) переопределить модель Workers AI
#   GEMINI_MODEL     — (необязательно) модель Gemini, по умолчанию gemini-2.0-flash
#
# Локальная разработка (бинды через флаги):
#   npx wrangler pages dev . --d1 DB=dropship-db --ai AI
